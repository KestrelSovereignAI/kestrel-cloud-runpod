name: kestrel-cloud-runpod CI

on:
  push:
    branches:
      - 'main'
      - 'feat/*'
      - 'fix/*'
      - 'extract/*'
      - 'codex/*'
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint-and-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install package + test extras
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .venv
          . .venv/bin/activate
          uv pip install -e '.[test]'
      - name: Validate package imports
        run: |
          . .venv/bin/activate
          python -c "
          from kestrel_cloud_runpod import RunPodFeature
          from kestrel_cloud_runpod.feature import RunPodFeature as F2
          assert RunPodFeature is F2
          print('kestrel_cloud_runpod imports OK; RunPodFeature class:', RunPodFeature.__name__)
          "
        timeout-minutes: 3
      - name: Validate pinned Runpod v2 OpenAPI contract
        run: |
          . .venv/bin/activate
          python scripts/check_runpod_openapi.py --check-pin

  build-check:
    runs-on: ubuntu-latest
    needs: lint-and-imports
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Build sdist + wheel
        run: uv build
      - name: Inspect wheel contents
        run: |
          set -e
          WHEEL=$(ls dist/*.whl | head -1)
          echo "Inspecting $WHEEL"
          uv run --no-project python -c "
          import zipfile, sys
          z = zipfile.ZipFile('$WHEEL')
          names = z.namelist()
          forbidden = [n for n in names if n.startswith('kestrel_sovereign/') or n.startswith('kestrel_sdk/')]
          if forbidden:
              print('ERROR: wheel contains framework/SDK content:', forbidden, file=sys.stderr)
              sys.exit(1)
          required = [
              'kestrel_cloud_runpod/__init__.py',
              'kestrel_cloud_runpod/feature.py',
              'kestrel_cloud_runpod/manager.py',
              'kestrel_cloud_runpod/core.py',
              'kestrel_cloud_runpod/inference_provider.py',
          ]
          missing = [m for m in required if m not in names]
          if missing:
              print('ERROR: wheel missing expected files:', missing, file=sys.stderr)
              sys.exit(1)
          print(f'Wheel OK ({len(names)} entries)')
          "

  install-check:
    runs-on: ubuntu-latest
    needs: build-check
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Clean install + smoke test
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-test
          . .venv-test/bin/activate
          uv pip install .
          python -c "
          from kestrel_cloud_runpod import RunPodFeature
          from kestrel_sdk.features.base import Feature
          from kestrel_sdk.llm import BackendType
          assert issubclass(RunPodFeature, Feature)
          import importlib.metadata as md
          # Modules production Frinz imports at module scope. Importing
          # RunPodFeature alone never reaches these, so an undeclared
          # dependency of theirs would ship undetected.
          import kestrel_cloud_runpod.signed_invocations as _si
          import kestrel_cloud_runpod.dogfood_contracts as _dc
          assert _dc.DogfoodPhase('lora_submit') is _dc.DogfoodPhase.LORA_SUBMIT
          # cryptography must be OUR declared dependency, not one we inherit.
          # signed_invocations imports it directly; today it resolves only
          # because kestrel-sovereign happens to pull it in, and the SDK
          # already proves that is revocable by putting it behind an extra.
          # Requires-Dist mixes unconditional deps with extras-conditional
          # ones ('pytest>=8.0.0; extra == \"test\"'). Demoting cryptography to
          # an extra is the precise failure mode cited above, so drop every
          # conditional entry before checking - otherwise the assertion would
          # still pass on exactly the regression it guards against.
          import re
          reqs = md.requires('kestrel-cloud-runpod') or []
          unconditional = [r for r in reqs if 'extra ==' not in r]
          dep_names = {re.split(r'[<>=!~;\[ ]', r, maxsplit=1)[0].strip().lower().replace('_', '-') for r in unconditional}
          assert 'cryptography' in dep_names, f'cryptography is imported but not an unconditional dependency: {reqs}'
          eps = md.entry_points(group='kestrel_sovereign.features')
          names = [e.name for e in eps]
          assert 'RunPodFeature' in names, f'Entry-point not registered: {names}'
          inference = md.entry_points(group='kestrel_sovereign.inference_lease_providers')
          providers = [e.name for e in inference]
          assert 'runpod' in providers, f'Inference entry-point not registered: {providers}'
          adapter = next(e for e in inference if e.name == 'runpod').load()()
          assert adapter.provider_name == 'runpod'
          print(f'kestrel-cloud-runpod installs + entry-point OK on Python ${{ matrix.python-version }}')
          "

  test:
    runs-on: ubuntu-latest
    needs: lint-and-imports
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install + run pytest
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .venv
          . .venv/bin/activate
          uv pip install -e '.[test]'
          uv run --no-sync pytest tests/ -v --tb=short -m "not cloud_resource"
        timeout-minutes: 5
