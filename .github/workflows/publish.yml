name: Publish to PyPI

# Triggered on a semver tag push (e.g. v0.1.0). The `ci` job calls
# the package's CI workflow as a reusable workflow — lint + build +
# install-matrix + tests must ALL pass on the tag's SHA before
# `build` and `publish` fire. Then `build` produces sdist + wheel,
# asserts tag version == pyproject version, and `publish` uploads to
# PyPI via OIDC trusted publishing. No API token used.
#
# Trusted publisher binding on PyPI:
#   project:     kestrel-cloud-runpod
#   owner:       KestrelSovereignAI
#   repository:  kestrel-cloud-runpod
#   workflow:    publish.yml
#   environment: pypi

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve and validate release source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Validate release tag before checkout
        id: tag
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref }}
        run: |
          python - <<'PY'
          import os, re
          value = os.environ["RELEASE_REF"]
          match = re.fullmatch(r"(?:refs/tags/)?v([0-9]+\.[0-9]+\.[0-9]+)", value)
          if match is None:
              raise SystemExit("release ref must be a vX.Y.Z tag")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"ref=refs/tags/v{match[1]}\nversion={match[1]}\n")
          PY
      - name: Check out requested release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.tag.outputs.ref }}
          persist-credentials: false
      - name: Freeze the validated release commit
        id: source
        env:
          EXPECTED_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          python - <<'PY'
          import os, re, subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if version != os.environ["EXPECTED_VERSION"]:
              raise SystemExit("release tag does not match package version")
          sha = subprocess.check_output(["git", "rev-parse", "--verify", "HEAD^{commit}"], text=True).strip()
          if re.fullmatch(r"[0-9a-f]{40}", sha) is None:
              raise SystemExit("release source is not an exact commit")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"sha={sha}\n")
          PY

  ci:
    name: CI gate
    needs: resolve
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  build:
    name: Build sdist + wheel
    needs: [resolve, ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Build
        run: uv build
      - name: Verify exact wheel and sdist envelope and source bytes
        run: uv run --no-project python scripts/check_distribution.py --dist dist
      - name: Verify the version metadata matches the tag
        env:
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if version != os.environ["EXPECTED_VERSION"]:
              raise SystemExit("release tag does not match built package version")
          PY
      - name: Show artifacts
        run: ls -la dist/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish via OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
