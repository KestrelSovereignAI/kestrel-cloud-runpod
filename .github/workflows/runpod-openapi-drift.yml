name: Runpod v2 OpenAPI drift

on:
  schedule:
    - cron: "31 7 * * 1"
  workflow_dispatch:

jobs:
  compare-live-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install schema parser
        run: python -m pip install 'PyYAML>=6.0.2,<7'
      - name: Compare pin with live beta contract
        run: python scripts/check_runpod_openapi.py --check-pin --check-live
