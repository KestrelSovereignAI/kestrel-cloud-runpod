[project]
name = "kestrel-cloud-runpod"
version = "0.9.0"
description = "RunPod GPU cloud provider for Kestrel Sovereign — provision pods, run training jobs, lifecycle management"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "UncleSaurus" }]
maintainers = [{ name = "UncleSaurus" }]
keywords = [
    "ai",
    "agents",
    "kestrel",
    "runpod",
    "gpu",
    "lora",
    "training",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "kestrel-sovereign-sdk>=0.35.0,<1",
    # Framework runtime dep: the manager uses kestrel_sovereign.config.load_config
    # to load the standalone $KESTREL_HOME/runpod_config.toml.
    "kestrel-sovereign>=0.13.1,<1",
    # Direct runtime dep of signed_invocations (Ed25519 receipt signing and
    # verification).  Declared explicitly rather than leaned on transitively:
    # kestrel-sovereign-sdk already puts cryptography behind a `crypto` extra,
    # so a future kestrel-sovereign inside `>=0.13.1,<1` doing the same would
    # otherwise leave `import kestrel_cloud_runpod.signed_invocations` raising
    # ModuleNotFoundError.  Floor matches the SDK's, the lowest in the
    # ecosystem; Ed25519 has been present since 2.6.
    "cryptography>=42.0",
    "httpx>=0.27.0,<1",
    "pydantic>=2.10.0,<3",
    "requests>=2.32.0,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.1.0",
    "PyYAML>=6.0.2,<7",
    "jsonschema>=4.23.0,<5",
]

[project.urls]
Homepage = "https://kestrelsovereign.com"
Source = "https://github.com/KestrelSovereignAI/kestrel-cloud-runpod"
Issues = "https://github.com/KestrelSovereignAI/kestrel-cloud-runpod/issues"

[project.entry-points."kestrel_sovereign.features"]
RunPodFeature = "kestrel_cloud_runpod.feature:RunPodFeature"

[project.entry-points."kestrel_sovereign.inference_lease_providers"]
runpod = "kestrel_cloud_runpod.inference_provider:RunpodInferenceLeaseProvider"

[project.scripts]
kestrel-runpod-reconcile-ollama = "kestrel_cloud_runpod.ollama_reconciler:main"
kestrel-runpod-reconcile-capacity = "kestrel_cloud_runpod.pod_capacity_reconciler:main"
kestrel-runpod-reconcile-training = "kestrel_cloud_runpod.training_reconciler:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kestrel_cloud_runpod"]

[tool.hatch.build.targets.sdist]
include = ["kestrel_cloud_runpod/**/*", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "cloud_resource: tests that touch real cloud (RunPod creds required)",
]
